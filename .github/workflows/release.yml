name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Run JS-based actions on Node 24 (Node 20 is deprecated; Node 24 is the default from 2026-06-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Package & publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud dev libraries
        shell: pwsh
        run: |
          $dest = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Stage artifact
        shell: pwsh
        run: |
          $zip = "src/EorzeaArsenalPlugin/bin/Release/EorzeaArsenalPlugin/latest.zip"
          if (-not (Test-Path $zip)) { Write-Error "Packaged zip not found at $zip"; exit 1 }
          Copy-Item $zip -Destination "latest.zip" -Force

      # What ships is what counts: the manifest inside the archive is authoritative, so the tag is
      # checked against it and not against the csproj. A tag that disagrees would publish an archive
      # saying one version under an index entry promising another, and the index is what a player's
      # client reads. Refusing here is the only place that can still stop it.
      - name: Refuse a tag that disagrees with the built version
        shell: pwsh
        run: |
          $expected = "${{ github.ref_name }}".TrimStart("v")
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "latest.zip").Path)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq "EorzeaArsenalPlugin.json" }
            if (-not $entry) { Write-Error "No manifest inside latest.zip."; exit 1 }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          }
          finally { $zip.Dispose() }

          $built = $manifest.AssemblyVersion
          if (-not $built) { Write-Error "The manifest carries no AssemblyVersion."; exit 1 }

          # The manifest carries four components, a tag carries three.
          $normalised = ([version]$built).ToString(3)
          if ($normalised -ne $expected) {
            Write-Error "Tag ${{ github.ref_name }} says $expected, the packaged manifest says $normalised. Not publishing."
            exit 1
          }

          Write-Output "tag and packaged manifest agree on $expected"

      - name: Generate pluginmaster.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/generate-pluginmaster.ps1 -Version $version -Tag "${{ github.ref_name }}"

      # Both the manifest and the binary are published as release assets and served via the stable
      # `releases/latest/download/<asset>` redirect. This means the workflow never pushes to `main`
      # (so `main` can be fully branch-protected) and the public custom-repo URL never changes:
      #   https://github.com/<owner>/<repo>/releases/latest/download/pluginmaster.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            latest.zip
            pluginmaster.json
          generate_release_notes: true
